name: mac-arm64-load-test

# 在 Apple Silicon（macos-15 就是 arm64）上验证加壳后的 macOS 插件：
#   1. 从每个 .plugin 里解出载荷镜像
#   2. 检查文件类型、签名、架构
#   3. 让系统真的 dlopen 它，并检查 EffectMain / PluginDataEntryFunction
#
# 用法：把 .plugin 文件夹和这个文件传到仓库，然后 Actions 页面点 "Run workflow"

on:
  workflow_dispatch:

jobs:
  arm64-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "CPU: $(uname -m)"
          sw_vers
          python3 --version

      - name: 准备解密脚本
        run: |
          cat > /tmp/decrypt.py <<'PY'
          import os, struct, sys

          GOLDEN = 0x9E3779B97F4A7C15
          MASK = (1 << 64) - 1

          def mix(z):
              z = (z + GOLDEN) & MASK
              z = ((z ^ (z >> 30)) * 0xBF58476D1CE4E5B9) & MASK
              z = ((z ^ (z >> 27)) * 0x94D049BB133111EB) & MASK
              return z ^ (z >> 31)

          bundle, out = sys.argv[1], sys.argv[2]
          macos = os.path.join(bundle, 'Contents', 'MacOS')
          exe = [n for n in os.listdir(macos)
                 if os.path.isfile(os.path.join(macos, n)) and not n.startswith('.')][0]

          stub = open(os.path.join(macos, exe), 'rb').read()
          i = stub.find(b'AEXKEY')
          if i < 0:
              sys.exit('stub 里找不到密钥标记（这个包没加壳或不是本工具打的）')
          key = struct.unpack('<Q', stub[i + 6:i + 14])[0]

          enc = open(os.path.join(bundle, 'Contents', 'Resources', exe + '.aexdata'), 'rb').read()
          buf = bytearray(enc)
          n = len(buf) // 8
          for k in range(n):
              w = struct.unpack_from('<Q', buf, k * 8)[0]
              struct.pack_into('<Q', buf, k * 8, w ^ mix(key + k * GOLDEN))
          rest = len(buf) - n * 8
          if rest:
              kk = mix(key + n * GOLDEN)
              for b in range(rest):
                  buf[n * 8 + b] ^= (kk >> (b * 8)) & 0xFF

          open(out, 'wb').write(buf)
          os.chmod(out, 0o755)
          print('  key       = %016x' % key)
          print('  decrypted = %d bytes' % len(buf))
          print('  magic     = %s' % bytes(buf[:4]).hex())
          PY

      - name: 逐个测试仓库里的 .plugin
        run: |
          set -e
          found=0
          for P in $(find . -maxdepth 3 -name '*.plugin' -type d | sort); do
            found=1
            echo ""
            echo "==================== $P ===================="
            python3 /tmp/decrypt.py "$P" /tmp/payload.bin

            echo "---- 文件类型 ----"
            file /tmp/payload.bin

            echo "---- 签名 ----"
            codesign -dvvv /tmp/payload.bin 2>&1 | head -6 || true

            echo "---- 架构 ----"
            lipo -archs /tmp/payload.bin || true

            echo "---- arm64 切片导出符号 ----"
            lipo -thin arm64 /tmp/payload.bin -output /tmp/payload_arm64.bin
            nm -gU /tmp/payload_arm64.bin | grep -E 'EffectMain|PluginDataEntry' || true

            echo "---- 加载测试（关键）----"
            python3 - <<'PY'
          import ctypes
          h = ctypes.CDLL('/tmp/payload.bin')
          print('LOAD OK  <- arm64 上可以正常加载')
          try:
              getattr(h, 'EffectMain')
              print('symbol EffectMain: OK')
          except AttributeError:
              raise SystemExit('EffectMain 缺失')
          for n in ('PluginDataEntryFunction', 'PluginDataEntryFunction2'):
              try:
                  getattr(h, n)
                  print('symbol %s: OK' % n)
              except AttributeError:
                  print('symbol %s: 无（可选）' % n)
          PY
          done

          if [ "$found" = "0" ]; then
            echo "仓库里没有找到 .plugin 文件夹" >&2
            exit 1
          fi
          echo ""
          echo "全部通过：这些加壳插件在 Apple Silicon 上可加载"
